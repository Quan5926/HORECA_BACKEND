spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=HORECAONE;encrypt=true;trustServerCertificate=true;integratedSecurity=false
    username: sa
    password: Horeca@2026!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-timeout: 30000
      keepalive-time: 300000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:tungquancoi59@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 20MB

jwt:
  secret: ${JWT_SECRET:horecaone-vipep-secret-key-2026-very-long-secure-random-32chars-min}
  expiration: 86400000

app:
  recaptcha:
    skip: true

logging:
  level:
    root: INFO
    com.example.horecaone: DEBUG
    org.springframework.security: WARN